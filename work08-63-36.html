<article><h1>มะม่วง</h1>
<p>มะม่วง (ชื่อวิทยาศาสตร์: Mangifera Indica) เป็นไม้ยืนต้นในสกุล Mangifera ซึ่งเป็นไม้ผลเมืองร้อนในวงศ์ Anacardiaceae[3] (กลุ่มเดียวกับถั่วพิสตาชีโอและมะม่วงหิมพานต์) เชื่อว่าเป็นพืชที่มีถิ่นกำเนิดในภูมิภาคอินเดีย บังกลาเทศ และพม่าตะวันตกเฉียงเหนือ</article></section>
